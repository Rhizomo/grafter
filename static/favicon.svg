<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0b1f1d"/>

  <!-- Trunk: center hub → bottom root -->
  <line x1="16" y1="16" x2="16" y2="26" stroke="#00e676" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Branch left -->
  <line x1="16" y1="16" x2="7"  y2="7"  stroke="#00bfa5" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Branch center -->
  <line x1="16" y1="16" x2="16" y2="5"  stroke="#00bfa5" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Branch right -->
  <line x1="16" y1="16" x2="25" y2="7"  stroke="#00bfa5" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Top nodes -->
  <circle cx="7"  cy="7"  r="2.2" fill="#00bfa5"/>
  <circle cx="16" cy="5"  r="2.2" fill="#00bfa5"/>
  <circle cx="25" cy="7"  r="2.2" fill="#00bfa5"/>

  <!-- Bottom root node -->
  <circle cx="16" cy="26" r="2.4" fill="#00e676"/>

  <!-- Center hub — accent, slightly larger to anchor the mark -->
  <circle cx="16" cy="16" r="2.8" fill="#00e676"/>
</svg>
