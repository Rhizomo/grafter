<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Sign in — Grafter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #060e0d; color: #c8e6e0;
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; position: relative; overflow: hidden;
    }
    .ambient {
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 55% at 4%  72%, #00bfa5 0%, transparent 100%),
        radial-gradient(ellipse 45% 40% at 96% 10%, #00e676 0%, transparent 100%),
        radial-gradient(ellipse 50% 45% at 55% 96%, #00bfa5 0%, transparent 100%);
      opacity: 0.07; pointer-events: none; z-index: 0;
      animation: breathe 14s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.06; transform: scale(1); }
      50%       { opacity: 0.10; transform: scale(1.04); }
    }
    @media (prefers-reduced-motion: reduce) { .ambient { animation: none; } }

    .wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 360px; padding: 20px;
    }
    .card {
      background: #0b1f1d; border: 1px solid #1a3d38;
      border-radius: 12px; padding: 36px 32px 28px;
    }
    .brand-row {
      display: flex; align-items: center; gap: 14px; margin-bottom: 28px;
    }
    .brand-logo { color: #00bfa5; flex-shrink: 0; }
    .brand-path {
      display: flex; align-items: baseline; gap: 5px; margin-bottom: 3px;
    }
    .brand-parent {
      font-size: 0.7rem; font-weight: 500; color: #2e5a52;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .brand-sep  { color: #2e5a52; font-size: 0.8rem; }
    .brand-name { font-size: 1rem; font-weight: 700; color: #00e676; letter-spacing: -0.5px; }
    .brand-sub  { font-size: 0.75rem; color: #2e5a52; margin-top: 2px; }
    .brand-sub strong { color: #6aa89a; font-weight: 500; }

    .btn-signin {
      display: flex; align-items: center; justify-content: center;
      width: 100%; padding: 11px 18px;
      background: #00e676; color: #060e0d;
      border: 1px solid #00e676; border-radius: 8px;
      font-size: 0.9rem; font-weight: 700; font-family: inherit;
      letter-spacing: 0.1px; cursor: pointer; text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-signin:hover { background: #00c864; border-color: #00c864; }
    .btn-signin:active { transform: scale(0.97); }

    .footer {
      margin-top: 20px; font-size: 0.72rem;
      color: #2e5a52; text-align: center; letter-spacing: 0.2px;
    }

    :focus-visible { outline: 2px solid #00e676; outline-offset: 2px; border-radius: 3px; }
  </style>
</head>
<body>
<div class="ambient"></div>

<div class="wrap">
  <div class="card">
    <div class="brand-row">
      <svg class="brand-logo" width="48" height="48" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 4V20.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M19.5 5.5L12.6 11.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <circle cx="20" cy="5" r="1.4" fill="currentColor"/>
        <path d="M9.3 10.2H14.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M9.3 13.8H14.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="2" fill="currentColor"/>
      </svg>
      <div>
        <div class="brand-path">
          <span class="brand-parent">rhizomo</span>
          <span class="brand-sep">/</span>
          <span class="brand-name">grafter</span>
        </div>
        <p class="brand-sub">Signing in to <strong>{{ realm }}</strong></p>
      </div>
    </div>

    <a href="/auth/start" class="btn-signin">Sign in</a>

    <p class="footer">Unauthorized access is logged.</p>
  </div>
</div>
</body>
</html>
